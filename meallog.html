<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5f2">
<title>食事記録</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="食事記録">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ログイン -->
<div class="overlay" id="login" hidden>
  <div class="card">
    <h1>食事記録</h1>
    <p class="lead">同期用のアカウントでログインしてください。</p>
    <input type="email" id="lgEmail" placeholder="メールアドレス" autocomplete="username">
    <input type="password" id="lgPass" placeholder="パスワード" autocomplete="current-password">
    <p class="err" id="lgErr" hidden></p>
    <button class="btn" id="lgBtn">ログイン</button>
    <button class="btn ghost" id="lgSkip">この端末だけで使う</button>
  </div>
</div>

<div class="wrap" id="app">
  <header>
    <div class="datebar">
      <button class="nav" id="prev" aria-label="前の日">‹</button>
      <div class="dcenter">
        <div class="dmain" id="dmain">—</div>
        <input type="date" id="dpick">
      </div>
      <button class="nav" id="next" aria-label="次の日">›</button>
    </div>
    <div class="totals">
      <div class="tcard tk">
        <div class="tlabel">カロリー</div>
        <div class="tval" id="dayK">0<small>kcal</small></div>
        <div class="bar"><i id="barK"></i></div>
        <div class="tgoal">目標 1500 kcal</div>
      </div>
      <div class="tcard tp">
        <div class="tlabel">タンパク質</div>
        <div class="tval" id="dayP">0<small>g</small></div>
        <div class="bar"><i id="barP"></i></div>
        <div class="tgoal">目標 100 g 以上</div>
      </div>
    </div>
  </header>

  <!-- 記録タブ -->
  <section class="page on" id="pg-log">
    <div id="slots"></div>

    <h2>体重・体脂肪率</h2>
    <div class="bodyrow">
      <div class="f">
        <label>体重 <span class="u">kg</span></label>
        <input type="number" id="wIn" inputmode="decimal" step="0.1" placeholder="—">
      </div>
      <div class="f">
        <label>体脂肪率 <span class="u">%</span></label>
        <input type="number" id="fIn" inputmode="decimal" step="0.1" placeholder="—">
      </div>
      <div class="f">
        <label>筋肉量 <span class="u">kg</span></label>
        <input type="number" id="mIn" inputmode="decimal" step="0.1" placeholder="—">
      </div>
    </div>
    <p class="note" id="syncNote">読み込み中…</p>
  </section>

  <!-- 集計タブ -->
  <section class="page" id="pg-sum">
    <h2>今週（月〜日）</h2>
    <div class="sum">
      <div class="st" id="wRange">—</div>
      <div class="sgrid">
        <div class="sitem k"><div class="sl">合計カロリー</div><div class="sv" id="wK">0<small>kcal</small></div></div>
        <div class="sitem p"><div class="sl">合計タンパク質</div><div class="sv" id="wP">0<small>g</small></div></div>
        <div class="sitem k"><div class="sl">1日平均</div><div class="sv" id="wKa">0<small>kcal</small></div></div>
        <div class="sitem p"><div class="sl">1日平均</div><div class="sv" id="wPa">0<small>g</small></div></div>
      </div>
      <p class="note" id="wDays">記録 0 日</p>
    </div>

    <h2>今月</h2>
    <div class="sum">
      <div class="st" id="mRange">—</div>
      <div class="sgrid">
        <div class="sitem k"><div class="sl">合計カロリー</div><div class="sv" id="mK">0<small>kcal</small></div></div>
        <div class="sitem p"><div class="sl">合計タンパク質</div><div class="sv" id="mP">0<small>g</small></div></div>
        <div class="sitem k"><div class="sl">1日平均</div><div class="sv" id="mKa">0<small>kcal</small></div></div>
        <div class="sitem p"><div class="sl">1日平均</div><div class="sv" id="mPa">0<small>g</small></div></div>
      </div>
      <p class="note" id="mDays">記録 0 日</p>
    </div>

    <h2>体重の推移</h2>
    <div class="sum">
      <svg class="chart" id="chart" viewBox="0 0 340 150" preserveAspectRatio="none" aria-label="体重と体脂肪率の推移"></svg>
      <div class="legend">
        <span><i style="background:var(--accent)"></i>体重 kg</span>
        <span><i style="background:var(--kcal)"></i>体脂肪率 %</span>
        <span><i style="background:var(--prot)"></i>筋肉量 kg</span>
      </div>
      <p class="note" id="chartNote">記録がまだありません。</p>
    </div>

    <h2>最近の記録</h2>
    <div class="sum scroll">
      <table>
        <thead><tr><th>日付</th><th>kcal</th><th>P(g)</th><th>体重</th><th>体脂肪</th><th>筋肉</th></tr></thead>
        <tbody id="hist"></tbody>
      </table>
    </div>

    <p class="note"><button class="linkbtn" id="logout" hidden>ログアウト</button></p>
  </section>
</div>

<nav class="tabs">
  <button class="on" data-pg="log">記録</button>
  <button data-pg="sum">集計</button>
</nav>

<!-- 追加シート -->
<div class="sheet" id="sheet" hidden>
  <div class="sheetbg" id="sheetBg"></div>
  <div class="sheetbody">
    <div class="sheethead">
      <strong id="sheetTitle">追加</strong>
      <button class="linkbtn" id="sheetClose">閉じる</button>
    </div>
    <input type="search" id="sheetSearch" placeholder="食品を検索" autocomplete="off">
    <div class="chips" id="sheetList"></div>
    <div class="form">
      <div class="fr"><input type="text" id="cName" placeholder="その他（外食など）の名前" autocomplete="off"></div>
      <div class="fr">
        <input type="number" id="cK" placeholder="kcal" inputmode="decimal">
        <input type="number" id="cP" placeholder="タンパク質 g" inputmode="decimal">
      </div>
      <label class="opt"><input type="checkbox" id="cSave">よく食べるものに登録する</label>
      <button class="btn" id="cAdd">追加</button>
    </div>
  </div>
</div>

<!-- 写真拡大 -->
<div class="overlay photo" id="viewer" hidden>
  <img id="viewerImg" alt="">
  <button class="linkbtn" id="viewerClose">閉じる</button>
</div>

<input type="file" id="photoInput" accept="image/*" hidden>
<div class="toast" id="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
